x-django-env: &django-env
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: CampusKart.settings.dev
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: django-db
    DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@campuskart.local}
    DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-Admin@12345}
    DJANGO_SUPERUSER_FULL_NAME: ${DJANGO_SUPERUSER_FULL_NAME:-CampusKart Admin}

services:
  # ─────────── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - django
      - daphne

  # ─────────── Frontend (Vite) ──────────────────────────────────────────────
  frontend:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app/frontend
    environment:
      VITE_API_URL: http://localhost/api/v1
      VITE_WS_URL: ws://localhost/ws
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - django

  # ─────────── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_duration_statement=100"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuskart_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamim01815}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────── Django (runserver / gunicorn) ─────────────────────────────────
  django:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *django-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py create_default_superuser &&
             python manage.py collectstatic --noinput &&
             gunicorn CampusKart.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────── Daphne / ASGI (WebSocket) ─────────────────────────────────────
  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *django-env
    command: daphne -b 0.0.0.0 -p 8001 CampusKart.asgi:application
    volumes:
      - .:/app
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────── Celery Worker ─────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *django-env
    command: celery -A CampusKart worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────── Celery Beat (periodic tasks) ──────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *django-env
    command: celery -A CampusKart beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  frontend_node_modules:
