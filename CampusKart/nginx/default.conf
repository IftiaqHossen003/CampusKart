map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;

    # Static and media are served directly by Nginx for better performance.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    # WebSocket traffic -> Daphne (ASGI)
    location /ws/ {
        set $daphne_upstream daphne:8001;
        proxy_pass http://$daphne_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # REST/API and other HTTP routes -> Django (WSGI)
    location / {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
